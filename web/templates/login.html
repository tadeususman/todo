{{define "content"}}
<div class="auth-container">
  {{template "authbrand"}}

  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  {{if .Info}}<div class="info">{{.Info}}</div>{{end}}

  <form method="post" action="/login" class="stack" novalidate data-validate>
    <label class="field">
      <span>Username atau email</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Masuk</button>
  </form>
  <p class="auth-alt">Belum punya akun? <a href="/register">Daftar</a></p>
</div>

<script>document.body.classList.add('auth')</script>
{{end}}
