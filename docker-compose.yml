services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: todo
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    container_name: todo-app-1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/todo?sslmode=disable
      TZ: ${TZ:-Asia/Jakarta}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set admin password in .env}

      PUBLIC_URL: ${PUBLIC_URL:-}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-}
      ANDROID_SHA256: ${ANDROID_SHA256:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}

      AI_PROVIDER: ${AI_PROVIDER:-bridge}
      BRIDGE_URL: ${BRIDGE_URL:-http://host.docker.internal:8765}
      BRIDGE_MODEL: ${BRIDGE_MODEL:-claude-sonnet-4-6}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    ports:
      - "127.0.0.1:8083:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy

volumes:
  todo_pgdata:

networks:
  proxy:
    external: true
